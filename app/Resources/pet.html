<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다마고치+</title>
<link rel="stylesheet" href="tama/tama.css">
<style>
  :root {
    --text: #fff; --dim: rgba(255,255,255,.68); --faint: rgba(255,255,255,.42); --line: rgba(255,255,255,.12);
    --card: rgba(255,255,255,.07); --blue: #6aa6ff; --blue2: #4d7cf5;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Pretendard", sans-serif;
    --round: ui-rounded, "SF Pro Rounded", -apple-system, "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); font-size: 13px; color: var(--text); background: linear-gradient(180deg, #2a2b33, #1c1d23); overflow: hidden;
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; cursor: default; }
  html.native body { background: rgba(26, 27, 33, .55); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:disabled { cursor: default; opacity: .4; }
  .num { font-variant-numeric: tabular-nums; }
  #app { position: relative; height: 100%; display: flex; flex-direction: column; padding: 34px 14px 12px; gap: 10px; }
  html.inframe #app { padding-top: 14px; }

  /* 머리 */
  .p-head { display: flex; align-items: center; gap: 10px; min-height: 46px; }
  .p-ava { width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, #dfe9f7); display: grid; place-items: center; overflow: hidden; flex: none;
    box-shadow: 0 0 0 2px rgba(255,255,255,.18); }
  .p-ava svg { width: 150%; height: 150%; object-fit: contain; transform: translateY(14%); flex: none; }
  .p-ava img { width: 116%; height: 116%; max-width: none; object-fit: contain; transform: translateY(5%); flex: none; }
  .p-ava .egg-svg { width: 90%; height: 90%; transform: none; }
  .p-id { flex: 1; min-width: 0; }
  .p-name { font-family: var(--round); font-size: 17px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; display: inline-block; vertical-align: middle; }
  .p-pen { width: 22px; height: 22px; display: inline-grid; place-items: center; color: var(--dim); vertical-align: middle; }
  .p-pen svg { width: 14px; height: 14px; }
  .p-name-in { width: 150px; height: 28px; border-radius: 8px; border: 1.5px solid var(--blue); background: rgba(0,0,0,.25); color: #fff; padding: 0 8px; font: 600 15px var(--font); outline: none; -webkit-user-select: text; user-select: text; }
  .p-sub { display: flex; gap: 6px; align-items: center; margin-top: 3px; }
  .p-chip { height: 20px; padding: 0 9px; border-radius: 999px; background: linear-gradient(180deg, #7db2ff, #5a8ef0); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; }
  .p-chip.dead { background: #6b6f7a; }
  .p-sp { font-size: 11px; color: var(--dim); }
  .p-coin { height: 32px; padding: 0 12px 0 6px; border-radius: 999px; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); display: flex; align-items: center; gap: 6px; font-weight: 700; }
  .coin-ic { width: 20px; height: 20px; flex: none; }

  /* 화면 */
  .p-main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .p-screen { position: relative; flex: 1; min-height: 170px; border-radius: 20px; overflow: hidden;
    background: linear-gradient(180deg, #9fd3ff 0%, #c8e9ff 42%, #bfe59a 43%, #8fcf6a 100%); background-size: cover; background-position: center 70%;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.35), 0 10px 26px rgba(0,0,0,.35); }
  .p-screen[style] .p-sky { display: none; }
  .p-sky { position: absolute; inset: 0; background:
      radial-gradient(60px 26px at 22% 18%, rgba(255,255,255,.95), transparent 70%),
      radial-gradient(80px 30px at 70% 12%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(160px 60px at 50% 48%, rgba(120,190,110,.6), transparent 70%); }
  .p-screen.night { filter: grayscale(.6) brightness(.7); }
  .p-screen.empty { display: grid; place-items: end center; }
  .p-pet { position: absolute; left: 50%; bottom: 6%; width: 66%; max-width: 230px; transform: translateX(-50%); transform-origin: 50% 100%; animation: idle 2.6s ease-in-out infinite; }
  .p-pet svg, .p-pet img { width: 100%; height: auto; display: block; filter: drop-shadow(0 8px 10px rgba(0,0,0,.18)); }
  .p-pet.egg { width: 34%; animation: wobble 3.2s ease-in-out infinite; }
  .p-pet img.st-baby { width: 62%; margin: 0 auto; }
  .p-pet img.st-teen { width: 82%; margin: 0 auto; }
  .fx-pet img.st-baby { width: 80%; margin: 0 auto; }
  .p-pet.egg.soon { animation-duration: 1.1s; }
  .p-pet.sad { animation-duration: 4s; filter: saturate(.8); }
  .p-pet.dead { animation: none; filter: grayscale(1) opacity(.65); }
  .p-nest { width: 70%; margin-bottom: 8%; }
  @keyframes idle { 0%, 100% { transform: translateX(-50%) scale(1, 1); } 50% { transform: translateX(-50%) translateY(-4px) scale(1.02, .98); } }
  @keyframes wobble { 0%, 70%, 100% { transform: translateX(-50%) rotate(0); } 76% { transform: translateX(-50%) rotate(-7deg); } 82% { transform: translateX(-50%) rotate(6deg); } 88% { transform: translateX(-50%) rotate(-3deg); } }
  .p-bubble { position: absolute; left: 62%; top: 16%; background: #fff; color: #3a3a46; font-weight: 700; padding: 6px 10px; border-radius: 12px; font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.15); animation: bob 1.8s ease-in-out infinite; }
  .p-stars { position: absolute; top: 14%; width: 100%; text-align: center; color: #fff6c8; letter-spacing: 14px; font-size: 16px; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  #app.fed .p-pet { animation: chomp .8s ease; }
  @keyframes chomp { 0%, 100% { transform: translateX(-50%) scale(1); } 30% { transform: translateX(-50%) scale(1.08, .92); } 60% { transform: translateX(-50%) scale(.96, 1.05) translateY(-6px); } }

  /* 상태 카드 */
  .p-card { background: rgba(0,0,0,.28); border-radius: 18px; padding: 12px 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); display: flex; flex-direction: column; gap: 8px; flex: none; }
  .p-card.center { align-items: center; text-align: center; }
  .p-card p { margin: 0; }
  .p-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .p-row.small { font-size: 11px; color: var(--dim); }
  .p-bar { height: 9px; border-radius: 5px; background: rgba(255,255,255,.1); overflow: hidden; }
  .p-bar i { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, #ffc76a, #ff9f5a); transition: width .5s; }
  .p-bar.xp i { background: linear-gradient(90deg, #6aa6ff, #4d7cf5); }
  .p-dots { display: flex; gap: 8px; }
  .p-dots i { flex: 1; height: 9px; border-radius: 5px; background: rgba(255,255,255,.12); }
  .p-dots i.on { background: linear-gradient(90deg, #ffd36e, #ffb14e); box-shadow: 0 0 10px rgba(255,190,90,.5); }
  .p-met { font-size: 12px; color: var(--dim); }
  .p-met.ok { color: #a6f0b0; font-weight: 600; }
  .p-note { font-size: 11px; color: var(--faint); line-height: 1.5; margin: 0; }
  .p-hunger { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .p-hunger svg { width: 13px; height: 13px; }
  .p-hunger.ok { background: rgba(255,120,140,.18); color: #ffb3c0; box-shadow: inset 0 0 0 1px rgba(255,140,160,.35); }
  .p-hunger.warn { background: rgba(255,190,80,.18); color: #ffd18a; box-shadow: inset 0 0 0 1px rgba(255,190,80,.4); }
  .p-hunger.bad { background: rgba(255,80,80,.22); color: #ff9c9c; box-shadow: inset 0 0 0 1px rgba(255,90,90,.55); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: inset 0 0 0 1px rgba(255,90,90,.55), 0 0 12px rgba(255,80,80,.5); } }
  .p-warn { font-size: 12px; font-weight: 700; color: #ffb0a8; background: rgba(255,80,80,.14); border-radius: 10px; padding: 6px 10px; }
  .p-hearts { display: inline-flex; gap: 3px; }
  .p-hearts i { width: 17px; height: 17px; color: rgba(255,255,255,.18); }
  .p-hearts i.on { color: #ff7f95; }
  .p-hearts svg { width: 100%; height: 100%; }
  .p-btn { height: 32px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.12); font-weight: 700; font-size: 12.5px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
  .p-btn.primary { background: linear-gradient(180deg, #7db2ff, #4d7cf5); box-shadow: 0 4px 14px rgba(77,124,245,.45); }
  .p-btn.wide { width: 100%; height: 36px; }
  .p-btn .coin-ic { width: 16px; height: 16px; }

  /* 탭 */
  .p-nav { display: flex; justify-content: space-around; gap: 6px; padding-top: 2px; flex: none; }
  .p-tab { width: 62px; height: 62px; border-radius: 50%; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); display: grid; place-items: center; align-content: center; gap: 1px; color: var(--dim); transition: transform .15s, background .2s; }
  .p-tab span { width: 24px; height: 24px; }
  .p-tab svg { width: 100%; height: 100%; }
  .p-tab small { font-size: 10.5px; font-weight: 700; }
  .p-tab:hover { transform: translateY(-2px); }
  .p-tab.on { color: #fff; background: radial-gradient(circle at 50% 35%, rgba(125,178,255,.55), rgba(77,124,245,.35)); box-shadow: inset 0 0 0 1.5px rgba(150,195,255,.8), 0 0 18px rgba(90,140,255,.45); }

  /* 먹이·도감·농장 스크롤 */
  .p-scroll { flex: 1; min-height: 0; overflow-y: auto; padding-right: 2px; }
  .p-h4 { margin: 4px 2px 8px; font-size: 13px; }
  .p-h4 small { display: block; font-weight: 400; font-size: 11px; color: var(--faint); margin-top: 2px; }
  .p-food { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: rgba(255,255,255,.06); margin-bottom: 6px; }
  .p-food-art { width: 40px; height: 40px; flex: none; }
  .p-food-art svg, .p-food-art img { width: 100%; height: 100%; object-fit: contain; }
  .p-food-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .p-food-txt small { color: var(--faint); font-size: 11px; line-height: 1.35; }
  .p-lack { position: absolute; right: 12px; bottom: -1px; font-style: normal; font-size: 10px; color: #ffb0a8; }
  .p-toast { position: absolute; left: 50%; bottom: 92px; transform: translate(-50%, 10px); max-width: 88%; padding: 9px 14px; border-radius: 12px; background: rgba(20,20,26,.92); box-shadow: 0 8px 24px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.12);
    font-size: 12.5px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; text-align: center; z-index: 30; }
  .p-toast.show { opacity: 1; transform: translate(-50%, 0); }
  .p-wait { margin: auto; color: var(--dim); }

  /* 연출(부화·성장·떠남·농장 확인) */
  .p-fx { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 28px 22px;
    background: radial-gradient(circle at 50% 34%, #5a4a32 0%, #26262f 55%, #1d1d24 100%); text-align: center; animation: fadein .3s ease; }
  .p-fx.died { background: radial-gradient(circle at 50% 38%, #3a3f5a, #18181f 65%); }
  .fx-txt h3 { margin: 6px 0 6px; font-family: var(--round); font-size: 19px; }
  .fx-txt p { margin: 0 0 14px; color: var(--dim); font-size: 12.5px; line-height: 1.5; }
  .fx-btns { display: flex; gap: 8px; justify-content: center; }
  .fx-pet { width: 62%; max-width: 210px; animation: popin .7s cubic-bezier(.2,1.6,.4,1) both; }
  .fx-pet svg, .fx-pet img { width: 100%; height: auto; }
  .fx-pet.farewell { width: 48%; opacity: .92; }
  .p-fx.hatch .fx-egg { position: absolute; top: 20%; width: 34%; animation: crack 1.4s ease forwards; }
  .p-fx .fx-pet, .p-fx .fx-txt { position: relative; }
  .p-fx.hatch .fx-pet { animation-delay: 1.2s; }
  .p-fx.hatch .fx-txt { animation: fadein .5s 1.5s both; }
  .fx-burst { position: absolute; top: 14%; width: 260px; height: 260px; border-radius: 50%;
    background: repeating-conic-gradient(rgba(255,226,140,.35) 0 10deg, transparent 10deg 24deg); animation: spin 8s linear infinite, fadein 1s 1s both; mask: radial-gradient(circle, #000 30%, transparent 70%); -webkit-mask: radial-gradient(circle, #000 30%, transparent 70%); }
  @keyframes crack { 0% { transform: rotate(0); } 15% { transform: rotate(-12deg); } 30% { transform: rotate(12deg); } 45% { transform: rotate(-14deg); } 60% { transform: rotate(14deg) scale(1.05); } 80% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
  @keyframes popin { from { transform: scale(.3) translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadein { from { opacity: 0; } }
  .rare { font-style: normal; font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
  .rare.c { background: rgba(255,255,255,.14); color: #e9eef7; }
  .rare.r { background: rgba(106,166,255,.25); color: #b9d6ff; }
  .rare.s { background: linear-gradient(90deg, #ffd36e, #ff9ec7); color: #4a2b10; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="tama/engine.js"></script>
<script src="tama/art.js"></script>
<script src="tama/ui.js"></script>
<script>
  const NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.pet);
  const INFRAME = !NATIVE && window.parent !== window;
  if (NATIVE) document.documentElement.classList.add("native");
  if (INFRAME) document.documentElement.classList.add("inframe");
  const send = (a) => {
    if (NATIVE) window.webkit.messageHandlers.pet.postMessage({ type: "petAction", action: a });
    else if (INFRAME) window.parent.postMessage({ petAction: a }, "*");
  };
  const app = TamaUI.mountPet(document.getElementById("app"), send);
  window.__petSync = (data) => app.sync(data);
  window.addEventListener("message", (e) => { if (e.data && e.data.petSync) app.sync(e.data.petSync); });
  setInterval(() => app.tick(), 30000);   // "~분 전" 글자 갱신
  app.render();
  send({ type: "ready" });
</script>
</body>
</html>
